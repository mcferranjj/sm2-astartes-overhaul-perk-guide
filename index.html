<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM2 Modded Perk Guide</title>
<style>
:root{
  --bg:#0c0f12; --panel:#12171b; --line:#2a3036; --dim:#7b858c; --text:#d7dcdf; --gold:#c9a04e; --gold2:#e8c777;
  --core:#c9a04e; --team:#5aa7c9; --gear:#8fa3b0; --sig:#c76a4a; --pres:#9b7fd1;
  --turquoise:#4fd1c5; --light_blue:#6cb6ff; --relic_rarity:#e8c777; --red:#ff6b5e; --blue:#6c8cff; --common_rarity:#b8c4cc;
  --majoris:#7fb4ff; --extremis:#ffa94d; --terminus:#ff6b5e; --minoris:#9ad27c; --cyan:#4fd1ff; --gray:#8a949a;
  --purple:#c08cff; --negative:#ff6b5e; --artificer_rarity:#a47fe0; --tut_color_4:#e8c777;
}
@media (prefers-color-scheme: light){ :root{} }
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#16222a 0,transparent 60%),var(--bg);color:var(--text);
  font-family:'Rajdhani','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;min-height:100vh}
a{color:var(--gold2)}
header{padding:18px 16px 10px;max-width:1500px;margin:0 auto}
.crumb{letter-spacing:.18em;font-size:13px;color:var(--dim);text-transform:uppercase}
h1{margin:2px 0 0;font-size:clamp(24px,4vw,40px);letter-spacing:.28em;color:var(--gold);text-transform:uppercase;font-weight:700}
.note{color:var(--dim);font-size:14px;max-width:900px;margin-top:6px;line-height:1.35}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
.tab{background:transparent;border:1px solid var(--line);color:var(--dim);padding:8px 18px;font:inherit;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-weight:600}
.tab[aria-selected=true]{color:var(--gold2);border-color:var(--gold);background:#1a1f22}
.tab:focus-visible,.hex:focus-visible,.chip:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.search{margin-left:auto;background:#0f1417;border:1px solid var(--line);color:var(--text);padding:8px 12px;font:inherit;min-width:200px}
main{max-width:1500px;margin:0 auto;padding:0 16px 40px}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{display:flex;align-items:center;gap:8px;background:#12181c;border:1px solid var(--line);color:var(--dim);padding:7px 12px;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.06em}
.chip[aria-selected=true]{color:#fff;border-color:var(--gold);background:#1b2226}
.chip .em{width:26px;height:26px}
.layout{display:block}

.classhead{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.classhead .em{width:84px;height:84px}
.classhead h2{margin:0;font-size:clamp(26px,5vw,38px);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.classhead .ab{color:var(--dim);letter-spacing:.06em}.classhead .ab b{color:var(--gold2);letter-spacing:.14em;text-transform:uppercase}
.hscroll{position:relative;overflow-x:auto;padding:10px 0 12px;-webkit-overflow-scrolling:touch}
.groups{display:flex;flex-wrap:nowrap;gap:14px;width:max-content}
.group{flex:none}
.group{border:1px dashed var(--line);background:rgba(18,23,27,.6);padding:0 12px 12px;position:relative;min-width:0}
.group>h3{margin:0 0 8px;transform:translateY(-9px);display:inline-block;background:var(--bg);padding:0 8px;font-size:13px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.cols{display:flex;gap:10px}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;width:96px;text-align:center}
.hex{width:70px;height:78px;border:0;padding:0;background:none;cursor:pointer;position:relative;color:var(--c,var(--gold))}
.hex svg{width:100%;height:100%;display:block}
.hex .poly{fill:#141a1e;stroke:currentColor;stroke-width:2.2}
.hex:hover .poly,.hex[aria-pressed=true] .poly{fill:#232c31;stroke:#fff}
.hex[aria-pressed=true]{color:#fff}
.hex .g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;letter-spacing:.04em;pointer-events:none}
.hex.alt .poly{stroke-dasharray:4 3}
.hex.unlock .poly{stroke:#7be08a;fill:#1b2a21}
.hex.req .poly{stroke:#6cb6ff;fill:#16232d}
.hex.block .poly{stroke:#ff6b5e;stroke-dasharray:3 3;fill:#2a1c1b}
.nm{font-size:13px;line-height:1.1;color:var(--text);margin-top:2px;min-height:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv{font-size:11px;color:var(--dim);letter-spacing:.12em}
.prestige{margin-top:16px;display:flex;gap:14px;flex-wrap:nowrap;width:max-content}
.detail{position:absolute;z-index:20;width:min(340px,calc(100vw - 16px));border:1px solid var(--gold);background:linear-gradient(180deg,#1a2126,#10151a);padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.7)}.detail[hidden]{display:none}.detail::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#10151a;border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg)}.detail.up::after{bottom:-7px;border-width:0 1px 1px 0}.detail.down::after{top:-7px;border-width:1px 0 0 1px;background:#1a2126}
.detail .kicker{letter-spacing:.2em;font-size:12px;color:var(--dim);text-transform:uppercase}
.detail h4{margin:4px 0 8px;font-size:22px;color:var(--gold2);letter-spacing:.04em}
.detail .desc{line-height:1.4;font-size:16px}
.detail .also{margin-top:10px;padding-top:8px;border-top:1px dotted var(--line)}.detail .also b{color:var(--gold2)}.detail .extra{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.4}
.detail .untext{margin-top:10px;font-size:13px;color:var(--extremis);border:1px dashed var(--extremis);padding:6px 8px}
.v{font-weight:700;color:#fff;background:rgba(255,255,255,.08);padding:0 3px;border-radius:2px}
.t-turquoise{color:var(--turquoise)}.t-light_blue{color:var(--light_blue)}.t-relic_rarity{color:var(--relic_rarity)}.t-red{color:var(--red)}
.t-blue{color:var(--blue)}.t-common_rarity{color:var(--common_rarity)}.t-majoris{color:var(--majoris)}.t-extremis{color:var(--extremis)}
.t-terminus{color:var(--terminus)}.t-minoris{color:var(--minoris)}.t-cyan{color:var(--cyan)}.t-gray{color:var(--gray)}.t-purple{color:var(--purple)}
.t-negative{color:var(--negative)}.t-artificer_rarity{color:var(--artificer_rarity)}.t-tut_color_4{color:var(--tut_color_4)}
.wname{font-size:clamp(24px,4vw,34px);letter-spacing:.14em;color:#fff;text-transform:uppercase;margin:2px 0}
.wsub{color:var(--dim);letter-spacing:.08em;margin-bottom:12px}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1000px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.tiers{grid-template-columns:1fr}}
.tier{border:1px solid var(--line);background:rgba(18,23,27,.6);padding:0 8px 10px;min-height:120px}
.tier>h3{margin:0;padding:8px 0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--line);margin-bottom:10px}
.tier.COMMON>h3{color:#b8c4cc}.tier.MASTERCRAFTED>h3{color:#5fcf7a}.tier.ARTIFICER>h3{color:#b27cff}.tier.RELIC>h3{color:#e8b94d}.tier.HEROIC>h3{color:#ff4f7a}
.layer{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 0;border-top:1px dotted #20272c}
.layer:first-of-type{border-top:0}
.layer .tag{width:100%;text-align:center;font-size:10px;letter-spacing:.2em;color:#58626a;text-transform:uppercase}
.legend{font-size:13px;color:var(--dim);margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid;margin-right:5px;vertical-align:-2px;border-radius:2px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.res{border:1px solid var(--line);background:#12181c;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.res:hover{border-color:var(--gold)}
.res b{color:var(--gold2)}.res small{display:block;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:11px;margin-bottom:3px}
footer{max-width:1500px;margin:0 auto;padding:0 16px 40px;color:var(--dim);font-size:13px;line-height:1.5}

.treewrap{position:relative;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.tree{position:relative;display:flex;min-width:1320px;border:1px solid var(--line);background:rgba(10,14,17,.7)}
.tcol{position:relative;min-width:0;border-left:1px solid #1d2428;display:flex;flex-direction:column}
.tcol:first-child{border-left:0}
.tcol header{max-width:none;margin:0;padding:8px 10px 6px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);position:relative;z-index:2}
.tcol header b{font-weight:600;color:#cfd6da;margin-right:6px}
.tcol header i{display:block;height:5px;background:linear-gradient(90deg,#4a5860,#9fb0b9);margin-top:6px;border-radius:1px}
.tcol.COMMON header span{color:#b8c4cc}.tcol.MASTERCRAFTED header span{color:#5fcf7a}.tcol.ARTIFICER header span{color:#b27cff}.tcol.RELIC header span{color:#e8b94d}.tcol.HEROIC header span{color:#ff4f7a}
.tcol.MASTERCRAFTED{background:linear-gradient(180deg,rgba(60,140,90,.10),transparent)}.tcol.ARTIFICER{background:linear-gradient(180deg,rgba(130,90,200,.12),transparent)}
.tcol.RELIC{background:linear-gradient(180deg,rgba(200,160,60,.12),transparent)}.tcol.HEROIC{background:linear-gradient(180deg,rgba(200,60,100,.14),transparent)}
.subs{display:flex;flex:1;position:relative;z-index:1}
.sub{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px 4px;min-width:130px}
.tn{display:flex;flex-direction:column;align-items:center;width:92px;text-align:center}
.tn .hex{width:58px;height:64px}
.tcol .nm{background:rgba(12,16,19,.9);padding:0 4px;border-radius:2px;position:relative}
.edges{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.edges path{fill:none;stroke:#34414a;stroke-width:1.4}

.tree2{border:1px solid var(--line);background:rgba(10,14,17,.7)}
.thead{display:flex}
.th{padding:8px 10px 6px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);border-left:1px solid #1d2428}
.th:first-child{border-left:0}
.th b{font-weight:600;color:#cfd6da;margin-right:6px}
.th i{display:block;height:5px;background:linear-gradient(90deg,#4a5860,#9fb0b9);margin-top:6px;border-radius:1px}
.th.COMMON span{color:#b8c4cc}.th.MASTERCRAFTED span{color:#5fcf7a}.th.ARTIFICER span{color:#b27cff}.th.RELIC span{color:#e8b94d}.th.HEROIC span{color:#ff4f7a}
.canvas{position:relative}
.tb{position:absolute;top:0;bottom:0;border-left:1px solid #1d2428}
.tb:first-child{border-left:0}
.tb.MASTERCRAFTED{background:linear-gradient(180deg,rgba(60,140,90,.10),transparent)}.tb.ARTIFICER{background:linear-gradient(180deg,rgba(130,90,200,.12),transparent)}
.tb.RELIC{background:linear-gradient(180deg,rgba(200,160,60,.12),transparent)}.tb.HEROIC{background:linear-gradient(180deg,rgba(200,60,100,.14),transparent)}
.canvas .edges{position:absolute;left:0;top:0;pointer-events:none}
.canvas .edges path{fill:none;stroke:#46555e;stroke-width:1.6}
.canvas .tn{position:absolute;width:110px;margin-left:-55px;height:64px;display:block}
.canvas .tn .hex{display:block;margin:0 auto;width:58px;height:64px}
.canvas .nm{position:absolute;left:0;right:0;text-align:center;font-size:13px;line-height:1.1;min-height:0;display:block;background:none;padding:0}
.canvas .nm.a{bottom:68px}.canvas .nm.b{top:68px}
.detail.lt::after,.detail.rt::after{top:var(--ay,50%);bottom:auto;transform:translateY(-50%) rotate(45deg)}
.detail.lt::after{left:auto;right:-7px;border-width:1px 1px 0 0}
.detail.rt::after{left:-7px;border-width:0 0 1px 1px}
</style>
</head>
<body>
<header>
  <div class="crumb">Armouring Hall /</div>
  <h1>Modded Perk Guide</h1>
  <div class="note">Class and weapon perks as the Astartes Lite mod has them. In-game menus on a vanilla install still show the original numbers, so use this page for the real ones.</div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabC" aria-selected="true">Class perks</button>
    <button class="tab" role="tab" id="tabW" aria-selected="false">Weapon perks</button>
    <input class="search" id="q" type="search" placeholder="Search all perks…" aria-label="Search all perks">
  </div>
</header>
<main id="app"></main>
<div class="detail lt" id="pop" role="dialog" aria-live="polite" hidden></div>
<script>
const DATA = {"classes":[{"id":"PVE_SOLDIER","name":"Tactical","base":[{"k":"SpawnWithJetpackAuspexScanAbility","n":"Auspex Scan","d":"[gray]Ability[gray]: Scanning reveals and marks enemies in the selected area for ‹8› seconds, making them more vulnerable. \\n[gray]Starting Perk[gray]: [turquoise]Bolt Weapons[turquoise] penetrate ‹1› more enemies. [turquoise]Non-Headshot Damage[turquoise] increases by ‹20%›.","i":"ability_auspex_scan"}],"core":[[{"k":"PveSoldierBuffPrimaryDamageDebuffSecondaryDamage","n":"Balanced Distribution","d":"Your [turquoise]Primary[turquoise] Weapon deals ‹10%› more Damage, but your [turquoise]Secondary[turquoise] Weapon deals ‹5%› less Damage","i":"perk_soldier_02","lvl":2},{"k":"PveSoldierBuffPlasmaDamageDependingOnHeatThreshold","n":"Plasma Boost","d":"When [turquoise]Plasma[turquoise] Weapons are ‹50%› [negative]Overheated[negative], their Damage increases by ‹30%› and their [turquoise]Charged Shots[turquoise] use ‹1› less energy","i":"perk_soldier_03","lvl":10},{"k":"PveSoldierBuffBolterPenetration","n":"Armour Reinforcement","d":"Non-Finisher [cyan]Gun Strikes[cyan] restore ‹1› [common_rarity]Armour[common_rarity] Segment","i":"perk_raider_05","lvl":18}],[{"k":"PveSoldierUnstoppableAfterPerfectDodge","n":"Heightened Vigour","d":"After a perfectly timed [blue]Parry[blue], [blue]Block[blue] or [blue]Dodge[blue], you deal ‹15%› more [light_blue]Melee[light_blue] and [cyan]Gun Strike[cyan] Damage, do not lose control upon taking Heavy Hits, and cannot be knocked back for ‹10› seconds","i":"perk_soldier_14","lvl":3},{"k":"PveSoldierBuffRangeDamageAfterGunstrike","n":"Relentless Pursuit","d":"After a [cyan]Gun Strike[cyan], [turquoise]Ranged[turquoise] Damage increases by ‹15%› for ‹10› seconds","i":"perk_soldier_09","lvl":11},{"k":"PveSoldierBuffSecondaryDamageAfterSwitching","n":"Versatility","d":"After switching Weapons, your [turquoise]Secondary[turquoise] Weapon does ‹20%› more Damage. The effect lasts until reloading or switching back to your [turquoise]Primary[turquoise] Weapon. If a [turquoise]Primary Weapon[turquoise] is equipped in the [turquoise]Secondary Weapon[turquoise] slot, it also benefits from this effect.","i":"perk_soldier_10","lvl":19}],[{"k":"PveSoldierReloadAfterFinisherAndBuffPrimary","n":"Emperor's Judgement","d":"After a Finisher, the equipped [turquoise]Ranged[turquoise] Weapon reloads automatically and your [turquoise]Ranged[turquoise] Weapons deals ‹20%› more Damage for ‹10› seconds","i":"perk_soldier_18","lvl":4},{"k":"PveSoldierReduceRecoil","n":"Focused Strike","d":"During a [cyan]Gun Strike[cyan], you do not lose control upon taking Heavy Hits, cannot be knocked back, and take ‹30%› less Damage","i":"perk_soldier_12_rework","lvl":12},{"k":"PveSoldierReceiveAmmoClipForKillEliteOrHigher","n":"Emperor's Vengeance","d":"Killing a [majoris]Majoris[majoris]-level or higher enemy restores your [turquoise]Primary[turquoise] Weapon's [turquoise]Ammo[turquoise] by ‹1› magazine or ‹30%› of maximum [turquoise]Ammo[turquoise] capacity for [turquoise]Primary[turquoise] Weapons that cannot be reloaded. Cannot exceed maximum [turquoise]Ammo[turquoise] capacity. Cooldown is ‹30› seconds.","i":"perk_soldier_13","lvl":20}]],"gear":[[{"k":"PveSoldierReduceAuspexCooldownForTargetArchetype","n":"Improved Efficiency","d":"[relic_rarity]Auspex Scan[relic_rarity] recharges ‹25%› faster","i":"perk_soldier_06_rework","lvl":6},{"k":"PveSoldierAuspexBuffMarkDurationIgnoreCommonAndFodder","n":"Pulse Auspex","d":"[relic_rarity]Auspex Scan[relic_rarity] emits a single pulse instead of creating a Scan zone. It has ‹2› Charges, but the radius is reduced by ‹25%›.","i":"perk_soldier_14_rework","lvl":14},{"k":"PveSoldierAuspexBuffDamageSensitivityFromEquipment","n":"Mobile Auspex","d":"[relic_rarity]Auspex Scan[relic_rarity] activates around you. Its radius increases by ‹30%› and it lasts ‹4› seconds longer. (Base Duration: ‹5› seconds)","i":"perk_soldier_22_rework","lvl":22}],[{"k":"PveSoldierApplyAuspe const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = {view:'class', cls:0, cat:'Primary', wep:null, sel:null, q:''};

// ---- description markup: [tag]..[tag] toggles a colour, ‹x› marks a parameter value
function rich(t){
  t = esc(t).replace(/\\n/g,'<br>');
  const stack = []; let out = '';
  const re = /\[(\/?)(\w+)\]|‹([^›]*)›/g; let last = 0, m;
  while((m = re.exec(t))){
    out += t.slice(last, m.index); last = re.lastIndex;
    if(m[3] !== undefined){ out += '<span class="v">'+(m[3]==='?'?'?':m[3])+'</span>'; continue; }
    const tag = m[2];
    if(m[1] || stack[stack.length-1] === tag){ if(stack.length){ stack.pop(); out += '</span>'; } }
    else { stack.push(tag); out += '<span class="t-'+tag+'">'; }
  }
  out += t.slice(last) + '</span>'.repeat(stack.length);
  return out;
}
const initials = n => { const w = n.replace(/[^A-Za-z' -]/g,'').split(/[\s-]+/).filter(Boolean); return (w.length>1 ? w[0][0]+w[1][0] : (w[0]||'?').slice(0,2)).toUpperCase(); };
const sqSVG = '<svg viewBox="0 0 70 78" aria-hidden="true"><rect class="poly" x="8" y="12" width="54" height="54" rx="3"/></svg>';
const hexSVG = '<svg viewBox="0 0 70 78" aria-hidden="true"><polygon class="poly" points="35,3 66,20 66,58 35,75 4,58 4,20"/></svg>';
function emblem(txt,color,cls=''){ return '<span class="em hex '+cls+'" style="--c:'+color+';display:inline-block;position:relative;cursor:default">'+hexSVG+'<span class="g" style="font-size:'+(cls?'':'')+'">'+esc(txt)+'</span></span>'; }

function hex(p, color, extra=''){
  const id = register(p);
  return '<div class="node"><button class="hex '+extra+'" data-id="'+id+'" style="--c:'+color+'" aria-pressed="'+(state.sel===id)+'" aria-label="'+esc(p.n)+'">'+hexSVG+'<span class="g">'+esc(initials(p.n))+'</span></button><div class="nm">'+esc(p.n)+'</div>'+(p.lvl?'<div class="lv">LV '+p.lvl+'</div>':'')+'</div>';
}
const REG = []; function register(p){ REG.push(p); return REG.length-1; }

function detailHTML(p){
  if(!p) return '<div class="kicker">Details</div><h4>Select a perk</h4><div class="desc" style="color:var(--dim)"></div>';
  let x = '<div class="kicker">'+esc(p.where||'Perk')+'</div><h4>'+esc(p.n)+'</h4><div class="desc">'+rich(p.d||'')+'</div>';
  const ex = [];
  if(p.lvl) ex.push('Unlocks at class level '+p.lvl);
  if(p.by && p.by.length) ex.push('Unlocked by: '+p.by.map(u=>esc(u)).join(', '));
  if(p.unl && p.unl.length) ex.push('Leads to: '+p.unl.map(u=>esc(u)).join(', '));
  if(p.blk && p.blk.length) ex.push('Cannot be combined with: '+p.blk.map(u=>esc(u)).join(', '));
  (p.also||[]).forEach(a => { x += '<div class="also"><div class="kicker">Also grants</div><b>'+esc(a.n)+'</b><div class="desc">'+rich(a.d||'')+'</div></div>'; });
  if(ex.length) x += '<div class="extra">'+ex.join('<br>')+'</div>';
  if(p.untext) x += '<div class="untext">This perk is added or reworked by the mod and has no description in the game files; the name above is derived from its internal ID.</div>';
  return x;
}

function render(){
  REG.length = 0; document.body.appendChild($('#pop')); $('#pop').hidden = true;
  const q = state.q.trim().toLowerCase();
  let html = '';
  if(q) html = renderSearch(q);
  else if(state.view==='class') html = renderClass();
  else html = renderWeapon();
  $('#app').innerHTML = html;
  $('#tabC').setAttribute('aria-selected', state.view==='class' && !q);
  $('#tabW').setAttribute('aria-selected', state.view==='weapon' && !q);
  $('#app').querySelectorAll('[data-id]').forEach(b => b.onclick = e => { e.stopPropagation(); state.sel = (state.sel===+b.dataset.id) ? null : +b.dataset.id; selectPerk(); });
  $('#app').querySelectorAll('[data-cls]').forEach(b => b.onclick = () => { state.cls = +b.dataset.cls; state.sel = null; render(); });
  $('#app').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; state.wep = null; state.sel = null; render(); });
  $('#app').querySelectorAll('[data-wep]').forEach(b => b.onclick = () => { state.wep = b.dataset.wep; state.sel = null; render(); });
  $('#app').querySelectorAll('[data-res]').forEach(b => b.onclick = () => { openResult(JSON.parse(b.dataset.res)); });
  drawEdges();
  if(state.sel!=null) selectPerk(true);
}
function selectPerk(quiet){
  const p = state.sel!=null ? REG[state.sel] : null;
  document.querySelectorAll('.hex[data-id]').forEach(h => { h.setAttribute('aria-pressed', +h.dataset.id===state.sel); h.classList.remove('unlock','block','req'); });
  const pop = $('#pop');
  if(!p){ pop.hidden = true; return; }
  if(p.uid){ // highlight what this weapon perk unlocks / blocks
    document.querySelectorAll('.hex[data-uid]').forEach(h => {
      if((p.unlocks||[]).includes(h.dataset.uid)) h.classList.add('unlock');
      if((p.reqUids||[]).includes(h.dataset.uid)) h.classList.add('req');
      if((p.blocks||[]).includes(h.dataset.uid) || (REG[+h.dataset.id].blocks||[]).includes(p.uid)) h.classList.add('block');
    });
  }
  pop.innerHTML = detailHTML(p); pop.hidden = false;
  const h = document.querySelector('.hex[data-id="'+state.sel+'"]'); if(!h) return;
  const cont = h.closest('.hscroll, .treewrap') || document.body;
  if(pop.parentNode !== cont) cont.appendChild(pop);
  pop.hidden = false;
  const r = h.getBoundingClientRect(), cr = cont.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const visL = Math.max(cr.left, 0) + 8, visR = Math.min(cr.right, document.documentElement.clientWidth) - 8;   // part of the container you can currently see
  const gap = 14, left = r.left - pw - gap >= visL;                 // to the left of the perk if it fits, otherwise to the right
  let xv = left ? r.left - pw - gap : r.right + gap;
  xv = Math.max(visL, Math.min(xv, visR - pw));
  const toX = v => v - cr.left + cont.scrollLeft - cont.clientLeft, toY = v => v - cr.top + cont.scrollTop - cont.clientTop;
  const cy = Math.max(0, Math.min(toY(r.top + r.height/2 - ph/2), cont.scrollHeight - ph));
  pop.className = 'detail ' + (left ? 'lt' : 'rt');
  pop.style.left = toX(xv) + 'px'; pop.style.top = cy + 'px';
  pop.style.setProperty('--ay', Math.max(16, Math.min(ph - 16, toY(r.top + r.height/2) - cy)) + 'px');
  if(!quiet && (r.top < 0 || r.bottom > innerHeight)) h.scrollIntoView({block:'center', behavior:'smooth'});
}
document.addEventListener('click', e => { if(state.sel!=null && !e.target.closest('.hex[data-id]') && !e.target.closest('#pop')){ state.sel=null; selectPerk(); } });
document.addEventListener('keydown', e => { if(e.key==='Escape' && state.sel!=null){ state.sel=null; selectPerk(); } });

const GC = {Core:'var(--core)', Team:'var(--team)', Gear:'var(--gear)', Signature:'var(--sig)'};
function renderClass(){
  const c = DATA.classes[state.cls];
  const strip = DATA.classes.map((k,i)=>'<button class="chip" data-cls="'+i+'" aria-selected="'+(i===state.cls)+'">'+emblem(k.name[0],'var(--gold)')+esc(k.name)+'</button>').join('');
  const mk = (list, where, color, extra) => list.map(p => hex(Object.assign({where}, p), color, extra)).join('');
  const colsHTML = (cols, where, color) => '<div class="cols">'+cols.map(col=>'<div class="col">'+mk(col, where+' perk', color)+'</div>').join('')+'</div>';
  const group = (title, inner) => '<section class="group"><h3>'+title+'</h3>'+inner+'</section>';
  const base = c.base.map(p => Object.assign({where:'Class ability'}, p));
  const baseHTML = base.length ? group('Ability', '<div class="cols"><div class="col">'+base.map(p=>hex(p,'var(--gold2)','alt')).join('')+'</div></div>') : '';
  const pres = c.prestige.map(pr => group('Prestige '+pr.level, '<div class="cols">'+pr.perks.map(p=>'<div class="col">'+hex(Object.assign({where:'Prestige '+pr.level+' perk'},p),'var(--pres)')+'</div>').join('')+'</div>')).join('');
  return '<div class="strip">'+strip+'</div>'+
   '<div class="layout"><div>'+
   '<div class="classhead">'+emblem(c.name[0],'var(--gold)')+'<div><h2>'+esc(c.name)+'</h2><div class="ab">Ability: <b>'+esc(((c.base.find(p=>!p.untext)||{}).n)||(c.name==='Apothecary'?'Narthecium':''))+'</b></div></div></div>'+
   '<div class="hscroll"><div class="groups">'+group('Core',colsHTML(c.core,'Core',GC.Core))+group('Team',colsHTML([c.team.map(p=>p)],'Team',GC.Team))+group('Gear',colsHTML(c.gear,'Gear',GC.Gear))+group('Signature',colsHTML(c.signature,'Signature',GC.Signature))+baseHTML+'</div>'+
   '<div class="prestige">'+pres+'</div></div>'+
   '</div></div>';
}

const CATS = ['Primary','Secondary','Melee'];
const TIERN = {COMMON:'Standard', MASTERCRAFTED:'Master-crafted', ARTIFICER:'Artificer', RELIC:'Relic'};
function renderWeapon(){
  const list = DATA.weapons.filter(w => w.cat === state.cat);
  if(!state.wep || !list.find(w=>w.id===state.wep)) state.wep = list[0].id;
  const w = list.find(x => x.id === state.wep);
  const cats = '<div class="strip">'+CATS.map(c=>'<button class="chip" data-cat="'+c+'" aria-selected="'+(c===state.cat)+'">'+c+'</button>').join('')+'</div>';
  const ws = '<div class="strip">'+list.map(x=>'<button class="chip" data-wep="'+x.id+'" aria-selected="'+(x.id===w.id)+'">'+esc(x.name)+'</button>').join('')+'</div>';
  const colors = {COMMON:'#b8c4cc',MASTERCRAFTED:'#5fcf7a',ARTIFICER:'#b27cff',RELIC:'#e8b94d',HEROIC:'#ff4f7a'};
  const reqs = {}; w.tiers.forEach(t => t.layers.forEach(l => l.forEach(p => (p.unlocks||[]).forEach(u => (reqs[u] = reqs[u] || []).push(p.uid)))));
  const SW = 140, Y1 = 185, Y2 = 295, YT = 75, YB = 405, H = 480;
  let x0 = 0, hdr = '', bg = '', nodes = '', d = '';
  const rowOf = {};
  const node = (p, cx, cy, color, square, lab, where) => {
    const id = register(Object.assign({where}, p, {unl:names(w,p.unlocks), blk:names(w,p.blocks), by:names(w,reqs[p.uid]), reqUids:reqs[p.uid]||[]}));
    return '<div class="tn" style="left:'+cx+'px;top:'+(cy-32)+'px"><button class="hex '+(square?'sq':'')+'" data-id="'+id+'" data-uid="'+esc(p.uid||'')+'" style="--c:'+color+'" aria-pressed="'+(state.sel===id)+'" aria-label="'+esc(p.n)+'">'+(square?sqSVG:hexSVG)+'<span class="g">'+esc(initials(p.n))+'</span></button><div class="nm '+lab+'">'+esc(p.n)+'</div></div>';
  };
  let lastCx = 0;
  w.tiers.forEach(t => {
    const nl = t.layers.length, lastSub = t.layers[nl-1].some(p => p.uid.includes('_sub'));
    const width = SW*nl + (lastSub ? SW/2 : 0);
    hdr += '<div class="th '+t.tier+'" style="width:'+width+'px"><span>'+(TIERN[t.tier]||t.tier)+'</span></div>';
    bg += '<div class="tb '+t.tier+'" style="left:'+x0+'px;width:'+width+'px"></div>';
    const where = (TIERN[t.tier]||t.tier)+' perk - '+w.name;
    t.layers.forEach((l, i) => {
      const cx = x0 + SW*i + SW/2, mains = l.filter(p => !p.uid.includes('_sub')), subs = l.filter(p => p.uid.includes('_sub'));
      mains.forEach((p, r) => { rowOf[p.uid] = {r, cx}; nodes += node(p, cx, r ? Y2 : Y1, colors[t.tier], i===0, r ? 'b' : 'a', where); lastCx = Math.max(lastCx, cx); });
      subs.forEach((p, k) => {                       // bonus perk: hangs off the middle of the row line, between this column and the next
        const par = (reqs[p.uid]||[]).map(u => rowOf[u]).find(Boolean), row = par ? par.r : k, ox = cx + SW/2, up = row === 0;
        nodes += node(p, ox, up ? YT : YB, colors[t.tier], false, up ? 'a' : 'b', where);
        d += 'M'+ox+' '+(up ? Y1 : Y2)+' V'+(up ? YT+32 : YB-32)+' ';
      });
    });
    x0 += width;
  });
  // the two upgrade rows run straight through every tier
  d += 'M'+SW/2+' '+Y1+' H'+lastCx+' M'+SW/2+' '+Y2+' H'+lastCx+' ';
  // vertical links between the rows: perks that unlock a perk on the other row
  const seen = new Set();
  w.tiers.forEach(t => t.layers.forEach(l => l.forEach(p => { const a = rowOf[p.uid]; if(!a) return;
    (p.unlocks||[]).forEach(u => { const b = rowOf[u]; if(!b || b.r === a.r) return;
      const x = a.cx === b.cx ? a.cx : (a.cx + b.cx)/2, k = x+'|'; if(seen.has(k)) return; seen.add(k); d += 'M'+x+' '+Y1+' V'+Y2+' '; }); })));
  // heroic
  const hx = x0 + 75;
  bg += '<div class="tb HEROIC" style="left:'+x0+'px;width:150px"></div>';
  hdr += '<div class="th HEROIC" style="width:150px"><span style="display:block;text-align:center;border:1px solid #6b2a40;padding:6px;margin-top:2px">Heroic</span></div>';
  w.heroic.forEach((p, i) => { const n = w.heroic.length; const cy = n > 1 ? (i ? Y2 : Y1) : (Y1+Y2)/2;
    nodes += node(Object.assign({uid:''}, p), hx, cy, colors.HEROIC, true, i ? 'b' : 'a', 'Heroic perk - '+w.name); });
  if(!w.heroic.length) nodes += '<div class="tn" style="left:'+hx+'px;top:'+((Y1+Y2)/2-10)+'px;color:var(--dim);font-size:13px;text-align:center;height:auto">No heroic perk</div>';
  const total = x0 + 150;
  return cats+ws+'<div class="wname">'+esc(w.name)+'</div><div class="wsub">'+state.cat+' weapon - perk tree</div>'+
    '<div class="treewrap"><div class="tree2" style="width:'+total+'px"><div class="thead">'+hdr+'</div><div class="canvas" id="tree" style="height:'+H+'px">'+bg+'<svg class="edges" id="edges" width="'+total+'" height="'+H+'"><path d="'+d+'"/></svg>'+nodes+'</div></div></div>';
}
function drawEdges(){}
function names(w, uids){
  const m = {}; w.tiers.forEach(t=>t.layers.forEach(l=>l.forEach(p=>m[p.uid]=p.n)));
  return (uids||[]).map(u=>m[u]).filter(Boolean);
}

// ---- search
const INDEX = [];
DATA.classes.forEach((c,ci)=>{
  const add = (p,where,extra)=>INDEX.push({n:p.n,d:p.d,where:c.name+' - '+where,go:{v:'class',c:ci}});
  c.base.forEach(p=>add(p,'Ability')); ['core','gear','signature'].forEach(g=>c[g].forEach(col=>col.forEach(p=>add(p,g[0].toUpperCase()+g.slice(1)))));
  c.team.forEach(p=>add(p,'Team')); c.prestige.forEach(pr=>pr.perks.forEach(p=>add(p,'Prestige '+pr.level)));
});
DATA.weapons.forEach(w=>{ w.tiers.forEach(t=>t.layers.forEach(l=>l.forEach(p=>INDEX.push({n:p.n,d:p.d,where:w.name+' - '+(TIERN[t.tier]||t.tier),go:{v:'weapon',cat:w.cat,w:w.id}})))); w.heroic.forEach(p=>INDEX.push({n:p.n,d:p.d,where:w.name+' - Heroic',go:{v:'weapon',cat:w.cat,w:w.id}})); });
function plain(s){ return s.replace(/\[\/?\w+\]/g,'').replace(/[‹›]/g,'').replace(/\\n/g,' '); }
function renderSearch(q){
  const hits = INDEX.filter(x => (x.n+' '+plain(x.d)).toLowerCase().includes(q));
  return '<p style="color:var(--dim)">'+hits.length+' perk'+(hits.length===1?'':'s')+' matching "'+esc(q)+'"</p><div class="results">'+hits.slice(0,120).map(x=>'<button class="res" data-res=\''+esc(JSON.stringify(x.go)).replace(/'/g,'&#39;')+'\'><small>'+esc(x.where)+'</small><b>'+esc(x.n)+'</b><div>'+rich(x.d)+'</div></button>').join('')+'</div>';
}
function openResult(g){
  $('#q').value=''; state.q=''; state.sel=null;
  if(g.v==='class'){ state.view='class'; state.cls=g.c; } else { state.view='weapon'; state.cat=g.cat; state.wep=g.w; }
  render(); window.scrollTo(0,0);
}

$('#tabC').onclick = () => { state.view='class'; state.sel=null; $('#q').value=''; state.q=''; render(); };
$('#tabW').onclick = () => { state.view='weapon'; state.sel=null; $('#q').value=''; state.q=''; render(); };
$('#q').oninput = e => { state.q = e.target.value; render(); };
render();
</script>
</body>
